services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacancy_parser}
      POSTGRES_USER: ${POSTGRES_USER:-vacancy_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-collector}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  vacancy-api:
    build:
      context: ./vacancy-api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_BROKER_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-collector}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-dev-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-collector.parse}
      RABBITMQ_VACANCY_QUEUE: ${RABBITMQ_VACANCY_QUEUE:-collector.hh.vacancies}
      RABBITMQ_JOB_STATUS_QUEUE: ${RABBITMQ_JOB_STATUS_QUEUE:-collector.hh.job-status}
      ConnectionStrings__VacancyDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vacancy_parser};Username=${POSTGRES_USER:-vacancy_api};Password=${POSTGRES_PASSWORD:-change-me};GSS Encryption Mode=Disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VACANCY_API_PORT:-8081}:8080"
    restart: unless-stopped

  vacancy-dashboard:
    image: vacancy-dashboard:dev
    build:
      context: ./vacancy-dashboard
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://vacancy-api:8080
      HTTP_PROXY: ${VACANCY_DASHBOARD_PROXY:-}
      HTTPS_PROXY: ${VACANCY_DASHBOARD_PROXY:-}
      http_proxy: ${VACANCY_DASHBOARD_PROXY:-}
      https_proxy: ${VACANCY_DASHBOARD_PROXY:-}
      npm_config_proxy: ${VACANCY_DASHBOARD_PROXY:-}
      npm_config_https_proxy: ${VACANCY_DASHBOARD_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,vacancy-api
      no_proxy: localhost,127.0.0.1,vacancy-api
    depends_on:
      - vacancy-api
    ports:
      - "127.0.0.1:${VACANCY_DASHBOARD_PORT:-5173}:5173"
    restart: unless-stopped
    volumes:
      - ./vacancy-dashboard:/app

  collector-playwright:
    build:
      context: ./collector
      dockerfile: Dockerfile
    environment:
      PLAYWRIGHT_DISPLAY_NUMBER: ${PLAYWRIGHT_DISPLAY_NUMBER:-50}
      PLAYWRIGHT_USER_DATA_DIR: /home/pwuser/profile
      COLLECTOR_STATE_DIRECTORY: ${COLLECTOR_STATE_DIRECTORY:-/home/pwuser/state}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_BROKER_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-collector}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-dev-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-collector.parse}
      RABBITMQ_JOB_STATUS_QUEUE: ${RABBITMQ_JOB_STATUS_QUEUE:-collector.hh.job-status}
    depends_on:
      rabbitmq:
        condition: service_healthy
    init: true
    ipc: host
    ports:
      - "127.0.0.1:${PLAYWRIGHT_NOVNC_PORT:-6080}:6080"
    restart: unless-stopped
    volumes:
      - playwright-profile:/home/pwuser/profile
      - collector-state:${COLLECTOR_STATE_DIRECTORY:-/home/pwuser/state}

volumes:
  collector-state:
  postgres-data:
  playwright-profile:
  rabbitmq-data:
